name: diana_data
description: >-
  Persistence for the Diana backend framework: an injectable query executor
  over knex_dart, ambient transactions with @Transactional, a lightweight
  migration runner and a database health indicator.
version: 0.15.0
repository: https://github.com/carmonac/diana-be-framework/tree/main/packages/diana_data
issue_tracker: https://github.com/carmonac/diana-be-framework/issues
documentation: https://carmonac.github.io/diana-be-framework/
topics:
  - database
  - sql
  - persistence
  - transactions

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  diana: ^0.15.0
  knex_dart: ^1.3.0
  meta: ^1.16.0

dev_dependencies:
  knex_dart_sqlite: ^0.4.0
  lints: ^5.1.0
  test: ^1.25.0
