name: diana_generator
description: >-
  Code generator for the Diana backend framework. Resolves the dependency
  injection graph at build time and emits the application composition root.
version: 0.15.0
repository: https://github.com/carmonac/diana-be-framework/tree/main/packages/diana_generator
issue_tracker: https://github.com/carmonac/diana-be-framework/issues
documentation: https://carmonac.github.io/diana-be-framework/
topics:
  - codegen
  - build-runner
  - dependency-injection

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  analyzer: ">=10.0.0 <15.0.0"
  build: ">=4.0.0 <6.0.0"
  code_builder: ^4.11.0
  collection: ^1.19.0
  dart_style: ^3.1.0
  diana_annotation: ^0.15.0
  glob: ^2.1.0
  path: ^1.9.0
  source_gen: ^4.2.0

dev_dependencies:
  build_runner: ^2.12.0
  build_test: ^3.3.0
  lints: ^5.1.0
  test: ^1.25.0
