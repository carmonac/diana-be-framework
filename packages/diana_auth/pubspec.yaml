name: diana_auth
description: >-
  Authentication and authorization for the Diana backend framework:
  pluggable authenticator strategies (JWT, HTTP Basic, API key),
  Spring-style @Secured/@RolesAllowed guards and principal binding.
version: 0.15.0
repository: https://github.com/carmonac/diana-be-framework/tree/main/packages/diana_auth
issue_tracker: https://github.com/carmonac/diana-be-framework/issues
documentation: https://carmonac.github.io/diana-be-framework/
topics:
  - authentication
  - authorization
  - jwt
  - security

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  crypto: ^3.0.0
  diana: ^0.15.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
