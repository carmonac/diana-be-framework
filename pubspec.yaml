name: _diana_workspace
description: Workspace root for the Diana backend framework monorepo.
publish_to: none

environment:
  sdk: ^3.6.0

dev_dependencies:
  args: ^2.6.0

workspace:
  - packages/diana_annotation
  - packages/diana
  - packages/diana_generator
  - packages/diana_auth
  - packages/diana_data
  - packages/diana_observability
  - packages/diana_grpc
  - examples/blog_api
  - examples/todo_api
  - examples/greeter_grpc
